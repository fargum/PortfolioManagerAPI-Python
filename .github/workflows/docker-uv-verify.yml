name: Docker Build + uv Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build-and-verify-uv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolio-api-python:ci .

      - name: Verify uv is available in image
        run: docker run --rm --entrypoint uv portfolio-api-python:ci --version
