[project]
name = "portfolio-manager-api"
version = "0.1.0"
description = "Python FastAPI implementation of Portfolio Manager API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # FastAPI and server
    "fastapi>=0.123.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Azure AD Authentication
    "fastapi-azure-auth>=5.0.0",
    # Database
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary,pool]>=3.2.0",
    "greenlet>=3.1.1",
    # Utilities
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0",
    # AI/ML - LangChain and Azure OpenAI
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.0.5",
    "azure-identity>=1.25.1",
    "openai>=2.26.0",
    # OpenTelemetry - all packages must be version-aligned
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
    "opentelemetry-instrumentation-logging>=0.60b0",
    "opentelemetry-semantic-conventions>=0.60b0",
    # Azure Monitor
    "azure-monitor-opentelemetry>=1.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "faker>=30.8.2",
    "aiosqlite>=0.20.0",
    "black>=24.10.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Ignore missing imports for packages without type stubs
ignore_missing_imports = true

# Pydantic mypy plugin settings
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

# SQLAlchemy-specific settings
[[tool.mypy.overrides]]
module = "src.db.models.*"
disable_error_code = ["misc", "valid-type"]

[[tool.mypy.overrides]]
module = "src.services.conversation_thread_service"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "src.services.currency_conversion_service"
disable_error_code = ["return-value", "assignment"]

[[tool.mypy.overrides]]
module = "src.services.ai.demos.phase1_demo"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "src.services.ai.langgraph_agent_service"
disable_error_code = ["assignment", "typeddict-item", "call-arg"]

# Pydantic alias handling - runtime accepts both field names and aliases
[[tool.mypy.overrides]]
module = ["src.services.holding_service", "src.api.routes.holdings"]
disable_error_code = ["call-arg"]
